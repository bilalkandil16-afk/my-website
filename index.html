<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage légal | المنصة القانونية الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --dark-wood: #2c1a12; --accent-gold: #c5a059; --paper-bg: #fdfaf5; --legal-brown: #5c3023;
        }
        body {
            font-family: 'Cairo', sans-serif; background-color: #f5f0e6;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png'); margin: 0;
        }
        header {
            background: linear-gradient(135deg, var(--dark-wood), #1a0d08);
            padding: 50px 20px; text-align: center; border-bottom: 6px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .logo { font-family: 'Amiri', serif; font-size: 3.5rem; color: var(--accent-gold); margin: 0; }
        .container { max-width: 1100px; margin: -30px auto 50px; padding: 0 20px; }
        .section-box {
            background: white; padding: 35px; border-radius: 3px; margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(61, 31, 20, 0.1); border: 1px solid rgba(197, 160, 89, 0.2);
        }
        h2 { font-family: 'Amiri', serif; color: var(--dark-wood); border-right: 5px solid var(--accent-gold); padding-right: 15px; }
        
        /* محرك البحث */
        .search-group { display: flex; border: 2px solid var(--accent-gold); overflow: hidden; margin-top: 20px; }
        .search-group input { flex: 1; border: none; padding: 15px; outline: none; font-size: 1.1rem; }
        .search-group button { background: var(--dark-wood); color: var(--accent-gold); border: none; padding: 0 30px; cursor: pointer; }

        /* منطقة الرفع */
        .upload-zone {
            border: 2px dashed var(--accent-gold); padding: 40px; text-align: center;
            background: #fcfbf7; cursor: pointer; transition: 0.3s;
        }
        .upload-zone:hover { background: white; transform: translateY(-3px); }

        /* بطاقات الملفات */
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .file-card {
            background: white; padding: 25px; border-top: 5px solid var(--legal-brown);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .file-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .tag { font-size: 0.7rem; color: var(--accent-gold); font-weight: bold; }
        .btn-dl {
            display: block; width: 100%; background: var(--dark-wood); color: var(--accent-gold);
            padding: 12px; text-align: center; text-decoration: none; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1 class="logo">⚖️ Partage légal</h1>
    <p style="color: var(--accent-gold); font-style: italic;">المجتمع الرقمي لتبادل المعرفة القانونية</p>
</header>

<div class="container">
    <div class="section-box">
        <h2>🔍 Legal Research Engine</h2>
        <div class="search-group">
            <input type="text" id="lawSearch" placeholder="ابحث عن مراجع PDF عالمية...">
            <button onclick="proSearch()"><i class="fa-solid fa-gavel"></i></button>
        </div>
    </div>

    <div class="section-box">
        <h2>📤 مساهمة المجتمع</h2>
        <div class="upload-zone" onclick="PartageApp.handleUpload()">
            <i class="fa-solid fa-file-circle-plus" style="font-size: 3rem; color: var(--legal-brown);"></i>
            <h3>اضغط هنا لإضافة رابط مرجع جديد</h3>
            <p>(Google Drive, Mediafire, Mega...)</p>
        </div>
    </div>

    <div class="section-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📚 المكتبة التشاركية</h2>
            <div id="filterBar">
                <button onclick="filterBy('الكل')">الكل</button>
            </div>
        </div>
        <div class="files-grid" id="proLibrary"></div>
    </div>
</div>

<script>
    const PartageApp = {
        db: JSON.parse(localStorage.getItem('pl_pro_db')) || [
            { id: 1, title: "شرح قانون الالتزامات والعقود", cat: "قانون مدني", url: "https://google.com", dl: 150, likes: 40 },
            { id: 2, title: "دليل قانون الأسرة المغربي", cat: "قانون الأسرة", url: "https://google.com", dl: 85, likes: 22 }
        ],

        init() { this.render(); },

        render() {
            const grid = document.getElementById('proLibrary');
            grid.innerHTML = this.db.map(f => `
                <div class="file-card">
                    <span class="tag">${f.cat}</span>
                    <h3 style="font-family: 'Amiri'; min-height: 50px;">${f.title}</h3>
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                        <span onclick="PartageApp.like(${f.id})" style="cursor:pointer; color:#b03030"><i class="fa-solid fa-heart"></i> ${f.likes}</span>
                        <span><i class="fa-solid fa-fire"></i> ${f.dl}</span>
                    </div>
                    <a href="#" onclick="PartageApp.download(${f.id})" class="btn-dl">تحميل المرجع</a>
                </div>
            `).join('');
        },

        handleUpload() {
            const title = prompt("أدخل اسم المرجع القانوني:");
            const url = prompt("أدخل رابط التحميل (Link):");
            if (!title || !url) return;

            const newFile = {
                id: Date.now(),
                title: title,
                url: url,
                cat: title.includes("مدني") ? "قانون مدني" : (title.includes("جنائي") ? "قانون جنائي" : "عام"),
                dl: 0, likes: 0
            };
            this.db.unshift(newFile);
            this.save();
            this.render();
        },

        like(id) { 
            const f = this.db.find(x => x.id === id); f.likes++; 
            this.save(); this.render(); 
        },

        download(id) {
            const f = this.db.find(x => x.id === id); f.dl++;
            this.save(); this.render();
            window.open(f.url, '_blank');
        },

        save() { localStorage.setItem('pl_pro_db', JSON.stringify(this.db)); }
    };

    function proSearch() {
        const v = document.getElementById('lawSearch').value;
        if(!v) return;
        window.open(`https://www.google.com/search?q="${v}" (site:talibdroit.com OR site:elkanoon.blogspot.com) filetype:pdf`, "_blank");
    }

    PartageApp.init();
</script>
</body>
</html>
