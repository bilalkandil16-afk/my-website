<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Analyzer | المحلل الذكي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية التصميم الزجاجي */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* منطقة رفع الملفات بتنسيق عصري */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.98); }

        /* منطقة النتائج */
        #result {
            margin-top: 30px;
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        .match-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-right: 4px solid var(--secondary);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            animation: fadeIn 0.5s ease;
        }

        .highlight { background: #fde047; color: black; padding: 2px 4px; border-radius: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="glass-card">
    <h1>📄 محلل المستندات الذكي</h1>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p id="fileName">اضغط هنا لرفع ملف PDF</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
    </div>

    <input type="text" id="query" placeholder="ابحث عن كلمة أو جملة داخل الملف...">
    <button onclick="searchText()">بدء التحليل البصري</button>

    <div id="result"></div>
</div>

<script>
    let pdfText = "";
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById("fileInput").addEventListener("change", async function(e) {
        const file = e.target.files[0];
        if(!file) return;
        
        document.getElementById("fileName").innerText = "جاري معالجة: " + file.name;
        
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            try {
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullContent = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullContent += content.items.map(item => item.str).join(" ") + "\n";
                }
                pdfText = fullContent;
                document.getElementById("fileName").innerText = "✅ تم تحميل " + pdf.numPages + " صفحات";
            } catch (err) {
                alert("حدث خطأ أثناء قراءة الملف");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function searchText() {
        const query = document.getElementById("query").value.trim();
        const resultDiv = document.getElementById("result");

        if (!pdfText) {
            resultDiv.innerHTML = "<p style='color:#f87171'>عذراً، ارفع ملفاً أولاً</p>";
            return;
        }
        if (!query) return;

        const lines = pdfText.split("\n");
        const matches = lines.filter(line => line.toLowerCase().includes(query.toLowerCase()));

        resultDiv.innerHTML = "";
        
        if (matches.length === 0) {
            resultDiv.innerHTML = "<p>لم يتم العثور على نتائج مطابقة.</p>";
        } else {
            matches.slice(0, 10).forEach(text => {
                const highlightedText = text.replace(new RegExp(query, 'gi'), match => `<span class="highlight">${match}</span>`);
                const item = document.createElement("div");
                item.className = "match-item";
                item.innerHTML = `... ${highlightedText} ...`;
                resultDiv.appendChild(item);
            });
        }
    }
</script>

</body>
</html>
