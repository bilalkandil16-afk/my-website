<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Légal</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <h1>⚖️ Partage Légal</h1>
    <p>منصة ذكية لمشاركة المراجع القانونية</p>
</header>

<section class="controls">

    <input id="searchInput" type="text" placeholder="🔍 ابحث عن مرجع...">

    <select id="filterSelect">
        <option value="الكل">الكل</option>
        <option value="قانون مدني">قانون مدني</option>
        <option value="قانون جنائي">قانون جنائي</option>
    </select>

    <select id="sortSelect">
        <option value="latest">الأحدث</option>
        <option value="popular">الأكثر إعجابًا</option>
    </select>

    <button onclick="App.addPrompt()">➕ إضافة</button>

</section>

<section id="grid" class="grid"></section>

<script src="app.js"></script>
</body>
</html>
