<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- الكود الكامل موجود في المرفقات وأدناه للنسخ المباشر -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك البحث القانوني المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS المختصر لجمالية الواجهة */
        body { font-family: 'Cairo', sans-serif; background: #0a192f; color: #e0e1dd; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 span { color: #d4af37; }
        .search-controls { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; margin-bottom: 40px; display: grid; grid-template-columns: 1fr auto auto; gap: 15px; }
        input, select, button { padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.08); color: white; }
        button { background: #d4af37; color: #0a192f; font-weight: bold; cursor: pointer; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .book-card { background: rgba(255,255,255,0.05); border-right: 4px solid #d4af37; padding: 25px; border-radius: 15px; transition: 0.3s; }
        .book-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }
        .tag { color: #d4af37; font-size: 0.8rem; font-weight: bold; }
        .download-btn { display: block; text-align: center; text-decoration: none; color: #d4af37; border: 1px solid #d4af37; padding: 10px; border-radius: 8px; margin-top: 20px; }
        .download-btn:hover { background: #d4af37; color: #0a192f; }
        @media (max-width: 768px) { .search-controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin: 40px 0;">
            <h1>مكتبة <span>القانون</span> الرقمية</h1>
            <p>محرك بحث متطور للمصادر القانونية العربية</p>
        </header>
        <div class="search-controls">
            <input type="text" id="searchInput" placeholder="ابحث عن عنوان أو مؤلف..." oninput="performSearch()">
            <select id="categorySelect" onchange="performSearch()">
                <option value="">جميع التخصصات</option>
                <option value="civil">قانون مدني</option>
                <option value="criminal">قانون جنائي</option>
                <option value="commercial">قانون تجاري</option>
            </select>
            <button onclick="performSearch()">بحث</button>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
    </div>
    <script>
        const books = [
            { title: "الوجيز في القانون الجنائي المغربي", author: "د. لطيفة الداودي", cat: "criminal", tag: "قانون جنائي", url: "https://elkanoon.blogspot.com/2016/06/Code-pena-lmarocain.html" },
            { title: "الوجيز في المنازعات الإدارية", author: "د. محمد بعلي", cat: "administrative", tag: "قانون إداري", url: "https://elkanoon.blogspot.com/2016/04/blog-post_98.html" },
            { title: "الشرح العلمي لقانون المسطرة الجنائية", author: "د. عبد الواحد العلمي", cat: "criminal", tag: "مسطرة جنائية", url: "https://kanonin.com/books/" },
            { title: "كتاب الحقوق العينية", author: "د. ادريس الفاخوري", cat: "civil", tag: "حقوق عينية", url: "https://kanonin.com/books/" },
            { title: "الوجيز في شرح المسطرة المدنية", author: "د. جواد أمهمول", cat: "civil", tag: "مسطرة مدنية", url: "https://kanonin.com/books/" },
            { title: "شرح قانون الالتزامات والعقود", author: "د. مأمون الكزبري", cat: "civil", tag: "التزامات وعقود", url: "https://www.fsjesouissi.com/search/label/" }
            // تم تضمين المزيد في الملف المرفق...
        ];
        function performSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const c = document.getElementById('categorySelect').value;
            const filtered = books.filter(b => (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) && (c === "" || b.cat === c));
            document.getElementById('resultsGrid').innerHTML = filtered.map(b => `
                <div class="book-card">
                    <span class="tag">${b.tag}</span>
                    <div style="font-size: 1.2rem; font-weight: bold; margin: 10px 0;">${b.title}</div>
                    <div style="color: #a0a0a0;">✍️ ${b.author}</div>
                    <a href="${b.url}" target="_blank" class="download-btn">📥 تحميل / فتح</a>
                </div>
            `).join('');
        }
        window.onload = performSearch;
    </script>
</body>
</html>
