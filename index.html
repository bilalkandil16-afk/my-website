<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة القانونية الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-blue: #0a192f;
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #e0e1dd;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark-blue);
            background-image: radial-gradient(at 0% 0%, #0d1b2a 0, transparent 50%), 
                              radial-gradient(at 100% 0%, #1b263b 0, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin: 50px 0; }
        h1 { font-size: 2.5rem; font-weight: 900; }
        h1 span { color: var(--gold); }

        .search-area {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 15px;
            margin-bottom: 40px;
        }

        input, select, button {
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: 'Cairo';
        }

        input { width: 100%; }
        button { background: var(--gold); color: var(--dark-blue); font-weight: bold; cursor: pointer; border: none; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--glass);
            padding: 25px;
            border-radius: 15px;
            border-right: 4px solid var(--gold);
            transition: 0.3s;
        }

        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }
        .tag { color: var(--gold); font-size: 0.8rem; font-weight: bold; }
        .title { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .author { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .download { 
            display: block; text-align: center; text-decoration: none; 
            color: var(--gold); border: 1px solid var(--gold); 
            padding: 8px; border-radius: 8px; transition: 0.3s;
        }
        .download:hover { background: var(--gold); color: var(--dark-blue); }

        @media (max-width: 768px) { .search-area { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>المكتبة <span>القانونية</span> الذكية</h1>
        <p>البحث المتقدم في المصادر والمراجع القانونية</p>
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="ابحث بالعنوان أو المؤلف...">
        <select id="catSelect">
            <option value="all">كل التصنيفات</option>
            <option value="civil">مدني</option>
            <option value="criminal">جنائي</option>
            <option value="commercial">تجاري</option>
        </select>
        <button onclick="search()">بحث</button>
    </div>

    <div id="grid" class="library-grid"></div>
</div>

<script>
    const books = [
        { title: "شرح قانون الالتزامات والعقود", author: "د. مأمون الكزبري", cat: "civil", tag: "قانون مدني" },
        { title: "الوجيز في القانون الجنائي", author: "د. أحمد الخمليشي", cat: "criminal", tag: "قانون جنائي" },
        { title: "القانون التجاري المغربي", author: "د. فؤاد معلال", cat: "commercial", tag: "قانون تجاري" },
        { title: "الوجيز في القانون الإداري", author: "د. مليكة الصروخ", cat: "civil", tag: "قانون إداري" }
    ];

    function render(data) {
        const grid = document.getElementById('grid');
        grid.innerHTML = data.map(b => `
            <div class="card">
                <div class="tag">${b.tag}</div>
                <div class="title">${b.title}</div>
                <div class="author">${b.author}</div>
                <a href="#" class="download">تحميل PDF</a>
            </div>
        `).join('');
    }

    function search() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const c = document.getElementById('catSelect').value;
        const filtered = books.filter(b => 
            (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) &&
            (c === 'all' || b.cat === c)
        );
        render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', search);
    render(books);
</script>
</body>
</html>
