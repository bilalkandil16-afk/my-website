<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage légal | منصة التشارك القانوني</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --dark-wood: #3d1f14; 
            --rich-brown: #5c3023;
            --gold-bronze: #a67c52; 
            --paper-bg: #f4ece1; 
            --text-dark: #2c1a12;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: var(--text-dark);
            margin: 0; padding: 0;
        }

        header {
            background: var(--dark-wood);
            padding: 25px 5%;
            border-bottom: 5px solid var(--gold-bronze);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .logo { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--gold-bronze); margin: 0; }

        .container { max-width: 1000px; margin: auto; padding: 40px 20px; }

        .section-box {
            background: #fff;
            padding: 30px;
            border-radius: 4px;
            margin-bottom: 30px;
            border: 1px solid #dcd0c0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 6px solid var(--rich-brown);
        }

        h2 { font-family: 'Amiri', serif; color: var(--dark-wood); border-bottom: 2px solid var(--gold-bronze); display: inline-block; padding-bottom: 5px; }

        /* محرك البحث Legal Research */
        .search-wrapper { display: flex; border: 2px solid var(--gold-bronze); border-radius: 4px; overflow: hidden; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 15px; border: none; outline: none; font-size: 1rem; font-family: 'Cairo'; }
        .btn-search { background: var(--dark-wood); color: var(--gold-bronze); border: none; padding: 0 30px; cursor: pointer; font-weight: bold; }

        /* منطقة الرفع */
        .upload-area {
            border: 2px dashed var(--gold-bronze);
            padding: 40px;
            text-align: center;
            background: rgba(166, 124, 82, 0.05);
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .upload-area:hover { background: rgba(166, 124, 82, 0.1); }
        .upload-area i { font-size: 3rem; color: var(--rich-brown); }

        /* شبكة الملفات */
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .file-card {
            background: #fff; padding: 20px; border: 1px solid #eee;
            border-right: 5px solid var(--gold-bronze);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tag { background: var(--paper-bg); color: var(--rich-brown); padding: 2px 10px; border-radius: 3px; font-size: 0.75rem; border: 1px solid var(--gold-bronze); }
        .stats { display: flex; gap: 10px; font-size: 0.85rem; }
