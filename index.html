<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage légal | Professional Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --dark-wood: #3d1f14; 
            --rich-brown: #5c3023;
            --gold-bronze: #a67c52; 
            --paper-bg: #fdfaf5; /* ورق أنقى وأكثر فخامة */
            --accent-red: #8b0000;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png'); /* نمط خفي يوحي بالرسمية */
            color: #1a1a1a;
            margin: 0; padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(to bottom, var(--dark-wood), #1a0d08);
            padding: 40px 5%;
            border-bottom: 6px solid var(--gold-bronze);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-box i { font-size: 3rem; color: var(--gold-bronze); margin-bottom: 10px; }
        .logo { font-family: 'Amiri', serif; font-size: 3.5rem; color: var(--gold-bronze); margin: 0; letter-spacing: 1px; }

        .container { max-width: 1100px; margin: auto; padding: 50px 20px; }

        /* الأقسام الاحترافية */
        .section-box {
            background: #fff;
            padding: 35px;
            border-radius: 2px; /* زوايا حادة لتعطي طابعاً رسمياً */
            margin-bottom: 40px;
            border: 1px solid #e0d5c5;
            position: relative;
            box-shadow: 15px 15px 0px rgba(61, 31, 20, 0.05); /* ظل خشبي فريد */
        }

        h2 { font-family: 'Amiri', serif; font-size: 2rem; color: var(--dark-wood); margin-top: 0; border-right: 5px solid var(--gold-bronze); padding-right: 15px; }

        /* محرك البحث */
        .search-group { display: flex; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        .search-group input { flex: 1; padding: 18px; border: 2px solid var(--gold-bronze); border-left: none; outline: none; font-size: 1.1rem; }
        .search-group button { background: var(--dark-wood); color: var(--gold-bronze); border: 2px solid var(--dark-wood); padding: 0 40px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .search-group button:hover { background: var(--gold-bronze); color: var(--dark-wood); }

        /* منطقة الرفع بتصميم عصري */
        .upload-zone {
            border: 3px dashed #d1c4b2;
            padding: 50px;
            text-align: center;
            background: #fcfbf9;
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .upload-zone:hover { border-color: var(--gold-bronze); background: #fff; transform: scale(1.01); }
        .upload-zone i { font-size: 4rem; color: var(--gold-bronze); margin-bottom: 20px; opacity: 0.8; }

        /* شريط التصفية (Filter Bar) */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 20px; background: #eee; border: none; cursor: pointer; border-radius: 4px; font-family: 'Cairo'; transition: 0.3s; }
        .filter-btn.active { background: var(--dark-wood); color: var(--gold-bronze); }

        /* بطاقات الملفات */
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .file-card {
            background: #fff; border: 1px solid #eee; padding: 25px;
            border-top: 4px solid var(--gold-bronze);
            transition: all 0.3s ease;
        }
        .file-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        
        .tag { font-size: 0.7rem; font-weight: bold; color: var(--gold-bronze); text-transform: uppercase; letter-spacing: 1px; }
        .file-title { font-size: 1.25rem; margin: 15px 0; color: var(--dark-wood); font-family: 'Amiri', serif; }
        
        .meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f0f0; pt: 15px; margin-top: 15px; }
        .btn-dl { background: var(--dark-wood); color: white; padding: 12px; text-align: center; text-decoration: none; display: block; border-radius: 4px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn-dl:hover { background: var(--accent-red); box-shadow: 0 5px 15px rgba(139, 0, 0, 0.3); }

        .like-btn { cursor: pointer; color: #ccc; transition: 0.3s; }
        .like-btn.liked { color: var(--accent-red); }

        footer { text-align: center; padding: 40px; color: var(--rich-brown); font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-scale-unbalanced"></i></div>
    <h1 class="logo">Partage légal</h1>
    <p style="color: var(--gold-bronze); font-style: italic;">المجتمع الرقمي لتبادل المعرفة القانونية</p>
</header>

<div class="container">
    
    <div class="section-box">
        <h2><i class="fa-solid fa-magnifying-glass-chart"></i> Legal Research Engine</h2>
        <div class="search-group">
            <input type="text" id="lawSearch" placeholder="بحث شامل في المراجع المغربية والدولية (PDF)...">
            <button onclick="proSearch()"><i class="fa-solid fa-gavel"></i></button>
        </div>
    </div>

    <div class="section-box">
        <h2><i class="fa-solid fa-arrow-up-from-bracket"></i> مساهمة المجتمع</h2>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-file-shield"></i>
            <h3 style="margin:0">أرسل ملفك الآن</h3>
            <p>شارك المذكرات، البحوث، أو الملخصات بصيغة PDF</p>
            <input type="file" id="fileInput" hidden onchange="proUpload(event)">
        </div>
    </div>

    <div class="section-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2><i class="fa-solid fa-book-bookmark"></i> أحدث المراجع</h2>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" onclick="filterBy('الكل')">الكل</button>
                <button class="filter-btn" onclick="filterBy('قانون مدني')">مدني</button>
                <button class="filter-btn" onclick="filterBy('قانون جنائي')">جنائي</button>
                <button class="filter-btn" onclick="filterBy('قانون الأسرة')">أسرة</button>
            </div>
        </div>
        <div class="files-grid" id="proLibrary"></div>
    </div>

</div>

<footer>
    <p>© 2026 Partage légal - جميع الحقوق محفوظة لطلبة القانون</p>
</footer>

<script>
    // بيانات افتراضية احترافية
    let db = JSON.parse(localStorage.getItem('pl_db')) || [
        { id: 1, title: "شرح قانون الالتزامات والعقود المغربي", cat: "قانون مدني", owner: "د. عبد الرزاق", dl: 1240, likes: 450 },
        { id: 2, title: "الوجيز في المسطرة الجنائية", cat: "قانون جنائي", owner: "أستاذ كمال", dl: 890, likes: 310 }
    ];

    let currentFilter = 'الكل';

    function render() {
        const grid = document.getElementById('proLibrary');
        const filtered = currentFilter === 'الكل' ? db : db.filter(f => f.cat === currentFilter);
        
        grid.innerHTML = filtered.map(f => `
            <div class="file-card">
                <span class="tag">${f.cat}</span>
                <h3 class="file-title">${f.title}</h3>
                <div class="meta">
                    <small><i class="fa-solid fa-user-tie"></i> ${f.owner}</small>
                    <div style="display:flex; gap:15px;">
                        <span class="like-btn" onclick="proLike(${f.id})"><i class="fa-solid fa-heart"></i> ${f.likes}</span>
                        <span style="color:var(--gold-bronze)"><i class="fa-solid fa-fire"></i> ${f.dl}</span>
                    </div>
                </div>
                <a href="#" class="btn-dl" onclick="proDl(${f.id})"><i class="fa-solid fa-download"></i> تحميل المرجع</a>
            </div>
        `).join('');
    }

    function filterBy(cat) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === cat);
        });
        render();
    }

    function proSearch() {
        const val = document.getElementById('lawSearch').value;
        if(!val) return;
        const query = encodeURIComponent(`"${val}" (site:talibdroit.com OR site:elkanoon.blogspot.com) filetype:pdf`);
        window.open(`https://www.google.com/search?q=${query}`, "_blank");
    }

    function proUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        
        let category = "عام";
        const n = file.name.toLowerCase();
        if(n.includes("مدني")) category = "قانون مدني";
        else if(n.includes("جنائي")) category = "قانون جنائي";
        else if(n.includes("أسرة")) category = "قانون الأسرة";

        const newEntry = {
            id: Date.now(),
            title: file.name.replace('.pdf', ''),
            cat: category,
            owner: "باحث قانوني",
            dl: 0,
            likes: 0
        };

        db.unshift(newEntry);
        localStorage.setItem('pl_db', JSON.stringify(db));
        render();
    }

    function proLike(id) {
        const item = db.find(x => x.id === id);
        item.likes++;
        localStorage.setItem('pl_db', JSON.stringify(db));
        render();
    }

    function proDl(id) {
        const item = db.find(x => x.id === id);
        item.dl++;
        localStorage.setItem('pl_db', JSON.stringify(db));
        render();
        alert("يتم الآن تحضير رابط التحميل الآمن...");
    }

    render();
</script>

</body>
</html>
