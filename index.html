<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 مكتبة القانون الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0a192f;
  color: #e0e1dd;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 40px;
}

h1 span {
  color: #d4af37;
}

.search-controls {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  margin-bottom: 30px;
}

input, select, button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
}

input, select {
  background: rgba(255,255,255,0.08);
  color: white;
}

button {
  background: #d4af37;
  color: #0a192f;
  font-weight: bold;
  cursor: pointer;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap: 20px;
}

.book-card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
  transition: 0.3s;
  border-right: 4px solid #d4af37;
}

.book-card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.1);
}

.tag {
  color: #d4af37;
  font-size: 12px;
}

.empty {
  text-align: center;
  opacity: 0.6;
  margin-top: 40px;
}

.loading {
  text-align: center;
  margin-top: 40px;
}

a {
  display: block;
  margin-top: 10px;
  text-align: center;
  padding: 10px;
  border: 1px solid #d4af37;
  border-radius: 8px;
  text-decoration: none;
  color: #d4af37;
}

a:hover {
  background: #d4af37;
  color: #0a192f;
}

@media (max-width: 768px) {
  .search-controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>مكتبة <span>القانون</span> الرقمية</h1>
<p>ابحث في أفضل المصادر القانونية بسهولة</p>
</header>

<div class="search-controls">
<input id="search" placeholder="ابحث عن كتاب أو مؤلف...">
<select id="cat">
<option value="">كل التخصصات</option>
<option value="civil">قانون مدني</option>
<option value="criminal">قانون جنائي</option>
<option value="administrative">قانون إداري</option>
<option value="commercial">قانون تجاري</option>
</select>
<button onclick="search()">بحث</button>
</div>

<div id="results" class="results-grid"></div>

</div>

<script>

// 📚 قاعدة البيانات
const books = [
{
title:"الوجيز في القانون الجنائي المغربي",
author:"لطيفة الداودي",
cat:"criminal",
tag:"جنائي",
url:"https://elkanoon.blogspot.com/2016/06/Code-pena-lmarocain.html"
},
{
title:"الوجيز في المنازعات الإدارية",
author:"محمد بعلي",
cat:"administrative",
tag:"إداري",
url:"https://elkanoon.blogspot.com/2016/04/blog-post_98.html"
},
{
title:"المسطرة المدنية",
author:"جواد أمهمول",
cat:"civil",
tag:"مدني",
url:"https://kanonin.com/books/"
},
{
title:"الحقوق العينية",
author:"إدريس الفاخوري",
cat:"civil",
tag:"حقوق عينية",
url:"https://kanonin.com/books/"
},
{
title:"قانون الالتزامات والعقود",
author:"مأمون الكزبري",
cat:"civil",
tag:"التزامات",
url:"https://www.fsjesouissi.com/search/label/"
}
];

// 🔍 تحسين البحث العربي
function normalize(text){
return text
.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ة/g,"ه")
.replace(/ى/g,"ي");
}

// 🔍 البحث
function search(){

showLoading();

setTimeout(() => {

const q = normalize(document.getElementById("search").value);
const cat = document.getElementById("cat").value;

const filtered = books.filter(b => {
const text = normalize(b.title + " " + b.author);
return text.includes(q) && (cat === "" || b.cat === cat);
});

render(filtered);

}, 200);
}

// 🎨 عرض النتائج
function render(data){
const container = document.getElementById("results");

if(data.length === 0){
container.innerHTML = `<div class="empty">❌ لا توجد نتائج</div>`;
return;
}

container.innerHTML = data.map(b => `
<div class="book-card">
<span class="tag">${b.tag}</span>
<h3>${b.title}</h3>
<p>${b.author}</p>
<a href="${b.url}" target="_blank">📥 فتح / تحميل</a>
</div>
`).join("");
}

// ⏳ loading
function showLoading(){
document.getElementById("results").innerHTML =
`<div class="loading">⏳ جاري البحث...</div>`;
}

// 🔥 البحث التلقائي
document.getElementById("search").addEventListener("input", search);
document.getElementById("cat").addEventListener("change", search);

// 🚀 تشغيل أولي
window.onload = search;

</script>

</body>
</html>
